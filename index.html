<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karishma's Secret Control</title>

    <style>
      :root {
        font-family: "Poppins", "Segoe UI", sans-serif;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% 20%, #ff6fa5 0%, transparent 40%),
          radial-gradient(circle at 80% 10%, #ffb3d1 0%, transparent 40%),
          linear-gradient(160deg, #1a0010 0%, #2b001a 100%);
        color: #fff;
      }

      .card {
        width: min(520px, 95%);
        background: rgba(255, 0, 90, 0.08);
        backdrop-filter: blur(12px);
        border-radius: 28px;
        padding: 1.8rem;
        border: 1px solid rgba(255, 120, 180, 0.3);
        box-shadow: 0 20px 50px rgba(255, 0, 120, 0.25);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .subtitle {
        margin: 0.5rem 0 1.2rem;
        font-size: 0.95rem;
        opacity: 0.8;
      }

      .image-placeholder {
        width: 100%;
        height: 200px;
        border-radius: 18px;
        background: linear-gradient(135deg, #ff3c88, #ff89b5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        opacity: 0.7;
      }

      .status-row {
        margin-bottom: 1rem;
      }

      #status {
        display: inline-block;
        padding: 0.4rem 1rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.85rem;
        background: rgba(255, 255, 255, 0.15);
        transition: all 0.3s ease;
      }

      #status.connecting {
        background: rgba(255, 180, 200, 0.3);
      }

      #status.connected {
        background: rgba(255, 0, 120, 0.6);
      }

      #status.disconnected {
        background: rgba(120, 0, 40, 0.6);
      }

      #holdBtn {
        width: 100%;
        padding: 1.1rem;
        border-radius: 20px;
        border: none;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        background: linear-gradient(140deg, #ff2f7f, #ff66a3);
        color: #fff;
        box-shadow: 0 15px 30px rgba(255, 0, 120, 0.35);
        transition: all 0.15s ease;
      }

      #holdBtn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 18px 35px rgba(255, 0, 120, 0.5);
      }

      #holdBtn:active:not(:disabled) {
        transform: scale(0.98);
      }

      #holdBtn.sending {
        background: linear-gradient(140deg, #ff0055, #ff3388);
        box-shadow: 0 18px 40px rgba(255, 0, 100, 0.6);
      }

      #holdBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #hint {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.85;
        min-height: 1.2rem;
      }

      .footer-text {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        opacity: 0.6;
      }

      @media (max-width: 420px) {
        .card {
          padding: 1.2rem;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>Karishma’s Secret Control 💕</h1>
      <p class="subtitle">Hold it… and make me feel it 💓</p>

      <div class="image-placeholder">
        ✨ Add Karishma’s photo here ✨
      </div>

      <div class="status-row">
        <span id="status" class="connecting">Waking it up...</span>
      </div>

      <button id="holdBtn" type="button" disabled>
        Touch & Hold 💗
      </button>

      <p id="hint" aria-live="polite">
        Waiting for you…
      </p>

      <div class="footer-text">
        Made for Karishma’s private moments 💋
      </div>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="./mqtt-control.js" defer></script>
  </body>
</html>
