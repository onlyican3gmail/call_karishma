<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karishma’s Private Control</title>

<style>
:root {
  font-family: "Poppins", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, #0f0008 0%, #220012 100%);
  color: #fff;
  overflow-x: hidden;
}

/* Background side images */
.side-image {
  position: fixed;
  top: 0;
  width: 35%;
  height: 100%;
  object-fit: cover;
  opacity: 0.25;
  filter: blur(8px) brightness(0.7);
  z-index: 0;
}

.side-left { left: 0; }
.side-right { right: 0; }

.card {
  position: relative;
  z-index: 2;
  width: min(520px, 92%);
  background: rgba(255, 0, 80, 0.08);
  backdrop-filter: blur(20px);
  border-radius: 32px;
  padding: 1.5rem;
  border: 1px solid rgba(255, 120, 180, 0.25);
  box-shadow: 0 25px 60px rgba(255, 0, 120, 0.3);
  overflow: hidden;
  text-align: center;
}

/* Hero Image */
.hero-image {
  width: 100%;
  height: 240px;
  border-radius: 22px;
  object-fit: cover;
  margin-bottom: 1rem;
  box-shadow: 0 15px 40px rgba(255, 0, 120, 0.4);
}

/* Subtle bottom image overlay */
.bottom-image {
  position: absolute;
  bottom: -40px;
  right: -30px;
  width: 160px;
  height: 200px;
  object-fit: cover;
  opacity: 0.3;
  filter: blur(2px);
  transform: rotate(-10deg);
  border-radius: 20px;
  pointer-events: none;
}

@keyframes heartbeat {
  0% { transform: scale(1); }
  20% { transform: scale(1.05); }
  40% { transform: scale(1); }
  60% { transform: scale(1.08); }
  80% { transform: scale(1); }
}

.card.active {
  animation: heartbeat 1s infinite;
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 15px rgba(255, 0, 100, 0.4); }
  50% { box-shadow: 0 0 40px rgba(255, 0, 140, 0.9); }
  100% { box-shadow: 0 0 15px rgba(255, 0, 100, 0.4); }
}

h1 {
  margin: 0.3rem 0;
  font-size: 1.8rem;
}

.subtitle {
  margin-bottom: 1rem;
  font-size: 0.95rem;
  opacity: 0.85;
}

#status {
  display: inline-block;
  padding: 0.4rem 1rem;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.85rem;
  background: rgba(255,255,255,0.15);
  margin-bottom: 1rem;
}

#status.connecting { background: rgba(255, 120, 160, 0.4); }
#status.connected { background: rgba(255, 0, 120, 0.7); }
#status.disconnected { background: rgba(120, 0, 40, 0.7); }

#holdBtn {
  width: 100%;
  padding: 1.2rem;
  border-radius: 24px;
  border: none;
  font-size: 1.3rem;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(140deg, #ff2f7f, #ff66a3);
  color: #fff;
  transition: all 0.15s ease;
}

#holdBtn.sending {
  background: linear-gradient(140deg, #ff0055, #ff3388);
  animation: pulseGlow 1s infinite;
}

#holdBtn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#hint {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.9;
  min-height: 1.2rem;
}
</style>
</head>

<body>

<!-- Background sexy images -->
<img src="YOUR_LEFT_IMAGE.jpg" class="side-image side-left">
<img src="YOUR_RIGHT_IMAGE.jpg" class="side-image side-right">

<main class="card" id="mainCard">

  <!-- Main dominant sexy image -->
  <img src="YOUR_MAIN_IMAGE.jpg" class="hero-image">

  <h1>Karishma’s Private Control 💕</h1>
  <p class="subtitle">Hold it… and feel me respond 💓</p>

  <span id="status" class="connecting">Waking up...</span>

  <button id="holdBtn" type="button" disabled>
    Touch & Hold Me 💗
  </button>

  <p id="hint">Waiting for you…</p>

  <!-- Subtle accent image -->
  <img src="YOUR_ACCENT_IMAGE.jpg" class="bottom-image">

</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="./mqtt-control.js" defer></script>

<script>
const holdBtn = document.getElementById("holdBtn");
const card = document.getElementById("mainCard");

holdBtn.addEventListener("mousedown", () => card.classList.add("active"));
holdBtn.addEventListener("mouseup", () => card.classList.remove("active"));
holdBtn.addEventListener("mouseleave", () => card.classList.remove("active"));
holdBtn.addEventListener("touchstart", () => card.classList.add("active"));
holdBtn.addEventListener("touchend", () => card.classList.remove("active"));
</script>

</body>
</html>
