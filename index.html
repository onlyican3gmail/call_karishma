<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karry Hold Pad</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 1rem 2rem;
        color: #182235;
        background:
          radial-gradient(circle at 15% 20%, #fff3d2 0%, transparent 42%),
          radial-gradient(circle at 85% 12%, #d7f5ff 0%, transparent 38%),
          linear-gradient(165deg, #ffe6ef 0%, #eaf0ff 45%, #e1fff4 100%);
      }

      .card {
        width: min(560px, 100%);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 28px;
        padding: 1.4rem;
        box-shadow:
          0 16px 40px rgba(97, 92, 164, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(7px);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 3.6vw, 1.75rem);
        line-height: 1.2;
      }

      .subtitle {
        margin: 0.4rem 0 1rem;
        font-size: 0.95rem;
        color: #4f5d75;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        margin-bottom: 1rem;
      }

      .status-label {
        margin: 0;
        font-size: 0.9rem;
      }

      #status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 126px;
        font-size: 0.82rem;
        font-weight: 800;
        border-radius: 999px;
        padding: 0.38rem 0.78rem;
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }

      #status.connecting {
        color: #7b5712;
        background: #fff4d1;
        border-color: #ffd16a;
      }

      #status.connected {
        color: #0f6b48;
        background: #dffbe8;
        border-color: #90e4ba;
      }

      #status.disconnected {
        color: #8b2f3d;
        background: #ffe6ea;
        border-color: #ffb6c5;
      }

      #holdBtn {
        width: 100%;
        border: 1px solid #7da6ff;
        border-radius: 16px;
        padding: 1rem 0.9rem;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #153a79;
        background: linear-gradient(140deg, #dff1ff 0%, #cfe1ff 100%);
        cursor: pointer;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          filter 0.12s ease;
        box-shadow: 0 10px 20px rgba(116, 153, 255, 0.2);
      }

      #holdBtn.sending {
        background: linear-gradient(140deg, #8bb3ff 0%, #6e98ff 100%);
        color: #ffffff;
        border-color: #5b8bff;
        box-shadow: 0 12px 24px rgba(86, 126, 243, 0.36);
      }

      #holdBtn:hover:not(:disabled) {
        filter: brightness(1.03);
      }

      #holdBtn:active:not(:disabled) {
        transform: translateY(1px) scale(0.997);
      }

      #holdBtn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      #hint {
        margin: 0.9rem 0 0;
        font-size: 0.9rem;
        color: #55657f;
        min-height: 1.3rem;
      }

      @media (max-width: 430px) {
        .card {
          border-radius: 22px;
          padding: 1rem;
        }

        #holdBtn {
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Karry Hold Pad</h1>
      <p class="subtitle">Press = ON, Release = OFF</p>

      <div class="status-row">
        <p class="status-label">Broker status</p>
        <span id="status" class="connecting">Connecting</span>
      </div>

      <button id="holdBtn" type="button" disabled>Press and Hold</button>

      <p id="hint" aria-live="polite">Connecting to MQTT broker...</p>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="./mqtt-control.js" defer></script>
  </body>
</html>
