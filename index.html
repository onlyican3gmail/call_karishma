<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karishma’s Private Control</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700;800&display=swap");

:root {
  color-scheme: dark;
  --bg-1: #13000f;
  --bg-2: #3d0228;
  --bg-3: #090007;
  --accent-1: #ff2b95;
  --accent-2: #ff58d0;
  --accent-3: #ffd7f2;
  --text-main: #fff5fc;
  --text-soft: #ffcaee;
  --card-bg: rgba(31, 5, 25, 0.78);
  --card-edge: rgba(255, 150, 225, 0.34);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  position: relative;
  min-height: 100vh;
  color: var(--text-main);
  font-family: "Manrope", sans-serif;
  background:
    radial-gradient(circle at 14% 6%, rgba(255, 90, 184, 0.34), transparent 36%),
    radial-gradient(circle at 88% 14%, rgba(255, 121, 214, 0.26), transparent 40%),
    linear-gradient(162deg, var(--bg-1) 0%, var(--bg-2) 54%, var(--bg-3) 100%);
  overflow-x: hidden;
  overflow-y: auto;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    repeating-linear-gradient(135deg, rgba(255, 231, 247, 0.022) 0 2px, transparent 2px 12px),
    linear-gradient(180deg, rgba(24, 0, 17, 0.08), rgba(9, 0, 6, 0.42));
  mix-blend-mode: soft-light;
}

.background-cloud {
  position: absolute;
  inset: 0 0 auto 0;
  height: 140vh;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.bg-photo {
  position: absolute;
  width: var(--w, 240px);
  height: var(--h, 280px);
  object-fit: cover;
  border-radius: 30px;
  left: var(--x, 50%);
  top: var(--y, 50%);
  opacity: var(--o, 0.16);
  filter:
    blur(var(--base-blur, 1.3px))
    saturate(1.08)
    brightness(1.34)
    contrast(1.04)
    sepia(0.08)
    hue-rotate(var(--hue, 0deg));
  transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1));
  animation: floatDrift var(--d, 18s) ease-in-out infinite alternate;
  border: 1px solid rgba(255, 214, 246, 0.24);
  mix-blend-mode: lighten;
  will-change: opacity, filter;
  transition:
    filter 1150ms ease-in-out,
    opacity 1150ms ease-in-out,
    box-shadow 1150ms ease-in-out;
}

.bg-photo.focus-reveal {
  opacity: 0.88 !important;
  filter:
    blur(0.18px)
    saturate(1.2)
    brightness(1.1)
    contrast(1.07)
    sepia(0.01)
    hue-rotate(var(--hue, 0deg));
  box-shadow:
    0 0 0 1px rgba(255, 214, 245, 0.56),
    0 18px 46px rgba(255, 43, 166, 0.42);
}

.warm-veil {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(circle at 28% 26%, rgba(255, 104, 197, 0.2), transparent 42%),
    radial-gradient(circle at 72% 74%, rgba(255, 73, 164, 0.18), transparent 50%),
    linear-gradient(180deg, rgba(29, 3, 20, 0.2), rgba(8, 1, 7, 0.58));
}

.ambient-orb {
  position: fixed;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  z-index: 3;
  pointer-events: none;
  filter: blur(38px);
  opacity: 0.34;
  animation: orbDrift 12s ease-in-out infinite alternate;
}

.orb-left {
  top: 2vh;
  left: -120px;
  background: radial-gradient(circle, rgba(255, 96, 199, 0.8), rgba(255, 70, 58, 0));
}

.orb-right {
  right: -110px;
  bottom: 8vh;
  background: radial-gradient(circle, rgba(255, 70, 170, 0.76), rgba(255, 140, 217, 0));
  animation-delay: 0.6s;
}

@keyframes floatDrift {
  from {
    transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1));
  }
  to {
    transform: translate(calc(-50% + var(--dx, 10px)), calc(-50% + var(--dy, -10px)))
      rotate(calc(var(--r, 0deg) + var(--rr, 4deg))) scale(calc(var(--s, 1) + 0.04));
  }
}

@keyframes orbDrift {
  from {
    transform: translate(0, 0) scale(1);
  }
  to {
    transform: translate(28px, -20px) scale(1.08);
  }
}

.page {
  position: relative;
  z-index: 4;
  width: min(920px, 94%);
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.4rem 0 2.5rem;
}

.card {
  position: relative;
  width: min(560px, 94%);
  background:
    linear-gradient(145deg, rgba(255, 138, 216, 0.14), transparent 35%),
    linear-gradient(145deg, var(--card-bg), rgba(62, 6, 40, 0.75));
  backdrop-filter: blur(22px) saturate(1.15);
  border-radius: 34px;
  padding: 1.8rem;
  border: 1px solid var(--card-edge);
  box-shadow:
    0 34px 92px rgba(255, 34, 168, 0.36),
    inset 0 1px 0 rgba(255, 229, 247, 0.24),
    inset 0 -36px 52px rgba(12, 1, 9, 0.42);
  overflow: hidden;
  text-align: center;
  animation: cardEntrance 680ms cubic-bezier(0.23, 1, 0.32, 1) both;
}

.card::before {
  content: "";
  position: absolute;
  inset: -120% -42%;
  background: linear-gradient(
    116deg,
    transparent 42%,
    rgba(255, 219, 244, 0.16) 50%,
    transparent 58%
  );
  transform: translateX(-34%) rotate(8deg);
  animation: sheen 9s ease-in-out infinite;
  pointer-events: none;
}

.card > * {
  position: relative;
  z-index: 1;
}

.hero-image {
  width: 100%;
  height: 250px;
  border-radius: 24px;
  object-fit: cover;
  margin-bottom: 1.2rem;
  border: 1px solid rgba(255, 213, 244, 0.38);
  box-shadow: 0 20px 50px rgba(255, 31, 167, 0.38);
  filter: saturate(1.08) contrast(1.05);
  transition: transform 240ms ease, box-shadow 240ms ease;
}

.bottom-image {
  position: absolute;
  bottom: -36px;
  right: -22px;
  width: 156px;
  height: 194px;
  object-fit: cover;
  opacity: 0.32;
  filter: blur(1.6px) saturate(1.06);
  transform: rotate(-8deg);
  border-radius: 22px;
  pointer-events: none;
  border: 1px solid rgba(255, 213, 244, 0.22);
}

.reveal {
  opacity: 0;
  transform: translateY(12px);
  animation: riseIn 520ms ease forwards;
}

.reveal-1 { animation-delay: 90ms; }
.reveal-2 { animation-delay: 170ms; }
.reveal-3 { animation-delay: 250ms; }
.reveal-4 { animation-delay: 330ms; }
.reveal-5 { animation-delay: 410ms; }

@keyframes heartbeat {
  0% { transform: scale(1); }
  20% { transform: scale(1.035); }
  40% { transform: scale(1); }
  60% { transform: scale(1.05); }
  80% { transform: scale(1); }
}

.card.active {
  animation: heartbeat 0.84s ease-in-out infinite;
}

.card.active .hero-image {
  transform: scale(1.02);
  box-shadow: 0 26px 62px rgba(255, 25, 170, 0.54);
}

@keyframes cardEntrance {
  from {
    opacity: 0;
    transform: translateY(22px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes riseIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulseGlow {
  0% {
    box-shadow:
      0 16px 34px rgba(255, 43, 169, 0.44),
      0 0 0 rgba(255, 126, 220, 0);
  }
  50% {
    box-shadow:
      0 24px 58px rgba(255, 33, 173, 0.62),
      0 0 30px rgba(255, 160, 233, 0.74);
  }
  100% {
    box-shadow:
      0 16px 34px rgba(255, 43, 169, 0.44),
      0 0 0 rgba(255, 126, 220, 0);
  }
}

@keyframes sheen {
  0%, 70%, 100% {
    transform: translateX(-38%) rotate(8deg);
  }
  86% {
    transform: translateX(46%) rotate(8deg);
  }
}

h1 {
  margin: 0.2rem 0;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(2rem, 4.2vw, 2.7rem);
  font-weight: 700;
  letter-spacing: 0.01em;
  text-wrap: balance;
}

.subtitle {
  margin: 0.28rem auto 1rem;
  max-width: 33ch;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-soft);
  opacity: 0.9;
}

#status {
  display: inline-block;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: rgba(255, 236, 249, 0.12);
  border: 1px solid rgba(255, 189, 231, 0.32);
  margin-bottom: 1rem;
}

#status.connecting {
  background: rgba(255, 123, 216, 0.34);
}

#status.connected {
  background: rgba(255, 72, 190, 0.56);
}

#status.disconnected {
  background: rgba(64, 8, 43, 0.72);
}

#holdBtn {
  width: 100%;
  padding: 1.16rem;
  border-radius: 22px;
  border: none;
  font-family: "Manrope", sans-serif;
  font-size: 1.04rem;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  cursor: pointer;
  background: linear-gradient(140deg, var(--accent-1), var(--accent-2) 58%, var(--accent-3));
  color: #32041f;
  box-shadow:
    0 18px 44px rgba(255, 50, 178, 0.42),
    inset 0 1px 0 rgba(255, 245, 252, 0.72),
    inset 0 -8px 16px rgba(126, 12, 88, 0.34);
  transition: transform 180ms ease, filter 180ms ease;
}

#holdBtn:hover:enabled {
  transform: translateY(-1px) scale(1.01);
  filter: brightness(1.03);
}

#holdBtn:active:enabled {
  transform: translateY(1px) scale(0.99);
}

#holdBtn.sending {
  background: linear-gradient(140deg, #ff1588, #ff4fc2 56%, #ffb2e8);
  animation: pulseGlow 0.82s ease-in-out infinite;
}

#holdBtn:disabled {
  opacity: 0.5;
  filter: grayscale(0.2);
  cursor: not-allowed;
}

#hint {
  margin-top: 1.04rem;
  font-size: 0.9rem;
  color: var(--text-soft);
  opacity: 0.94;
  min-height: 1.2rem;
  padding: 0 0.1rem;
}

@media (max-width: 760px) {
  .page {
    align-items: flex-start;
    padding-top: 1.1rem;
  }

  .card {
    width: min(560px, 95%);
    padding: 1.3rem;
  }

  .hero-image {
    height: 220px;
  }

  .bottom-image {
    width: 130px;
    height: 168px;
    bottom: -40px;
    right: -36px;
    opacity: 0.26;
  }
}

@media (max-width: 460px) {
  h1 {
    font-size: 1.95rem;
  }

  .subtitle {
    font-size: 0.8rem;
  }

  #holdBtn {
    font-size: 0.92rem;
    padding: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .bg-photo,
  .ambient-orb,
  .card,
  .card::before,
  .reveal,
  #holdBtn.sending {
    animation: none !important;
  }

  .bg-photo {
    transition: none !important;
  }

  .reveal {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="background-cloud" id="backgroundCloud" aria-hidden="true"></div>
<div class="warm-veil" aria-hidden="true"></div>
<div class="ambient-orb orb-left" aria-hidden="true"></div>
<div class="ambient-orb orb-right" aria-hidden="true"></div>

<div class="page">
  <main class="card" id="mainCard">

    <img src="pics/pic_1.png" class="hero-image reveal reveal-1" alt="Hero image">

    <h1 class="reveal reveal-2">Karishma’s Midnight Control</h1>
    <p class="subtitle reveal reveal-3">Private touch. Instant response. Hotter visuals.</p>

    <span id="status" class="connecting">Waking up...</span>

    <button id="holdBtn" class="reveal reveal-4" type="button" disabled>
      Touch & Hold Me
    </button>

    <p id="hint" class="reveal reveal-5">Waiting for you...</p>

    <img src="pics/pic_4.png" class="bottom-image" alt="" aria-hidden="true">

  </main>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="./mqtt-control.js" defer></script>

<script>
const holdBtn = document.getElementById("holdBtn");
const card = document.getElementById("mainCard");
const backgroundCloud = document.getElementById("backgroundCloud");

const setCardActive = (active) => card.classList.toggle("active", active);

holdBtn.addEventListener("pointerdown", () => setCardActive(true));
holdBtn.addEventListener("pointerup", () => setCardActive(false));
holdBtn.addEventListener("pointerleave", () => setCardActive(false));
holdBtn.addEventListener("pointercancel", () => setCardActive(false));
holdBtn.addEventListener("lostpointercapture", () => setCardActive(false));
window.addEventListener("blur", () => setCardActive(false));

const extensionOverrides = {
  243: "jpg",
  244: "jpg",
  246: "webp",
  247: "jpg",
  248: "webp",
  249: "webp",
  250: "webp",
  253: "webp"
};

const totalImages = 253;
const cols = 4;
const rowStep = 190;
const cloudTop = 220;
const rows = Math.ceil(totalImages / cols);
const cloudHeight = rows * rowStep + 900;

const rand = (n, salt) => {
  const v = Math.sin((n + 1) * 12.9898 + salt * 78.233) * 43758.5453;
  return v - Math.floor(v);
};

backgroundCloud.style.height = `${cloudHeight}px`;
document.body.style.minHeight = `${Math.max(window.innerHeight, cloudHeight)}px`;
const backgroundPhotos = [];

for (let i = 1; i <= totalImages; i += 1) {
  const ext = extensionOverrides[i] || "png";
  const src = `pics/pic_${i}.${ext}`;
  const col = (i - 1) % cols;
  const row = Math.floor((i - 1) / cols);

  const xBase = ((col + 0.5) / cols) * 100;
  const xJitter = (rand(i, 1) - 0.5) * 36;
  const x = Math.max(4, Math.min(96, xBase + xJitter));
  const y = cloudTop + row * rowStep + (rand(i, 2) - 0.5) * 140 + rand(i, 3) * 40;
  const width = 175 + Math.round(rand(i, 4) * 170);
  const height = Math.round(width * (0.82 + rand(i, 5) * 0.42));

  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.loading = "lazy";
  img.decoding = "async";
  img.className = "bg-photo";
  img.setAttribute("aria-hidden", "true");

  img.style.setProperty("--x", `${x}%`);
  img.style.setProperty("--y", `${y}px`);
  img.style.setProperty("--w", `${width}px`);
  img.style.setProperty("--h", `${height}px`);
  img.style.setProperty("--o", `${0.09 + rand(i, 6) * 0.11}`);
  img.style.setProperty("--r", `${-18 + rand(i, 7) * 36}deg`);
  img.style.setProperty("--s", `${0.88 + rand(i, 8) * 0.25}`);
  img.style.setProperty("--hue", `${-12 + rand(i, 9) * 12}deg`);
  img.style.setProperty("--dx", `${-18 + rand(i, 10) * 36}px`);
  img.style.setProperty("--dy", `${-14 + rand(i, 11) * 28}px`);
  img.style.setProperty("--rr", `${-6 + rand(i, 12) * 12}deg`);
  img.style.setProperty("--d", `${12 + Math.floor(rand(i, 13) * 12)}s`);
  img.style.setProperty("--base-blur", `${(0.8 + rand(i, 14) * 1.5).toFixed(2)}px`);

  backgroundCloud.appendChild(img);
  backgroundPhotos.push(img);
}

const FOCUS_CLASS = "focus-reveal";
const FOCUS_FADE_MS = 1150;
const FOCUS_HOLD_MS = 900;
let focusTimeout = null;
let nextFocusTimer = null;
let lastFocusedIndex = -1;

const getVisiblePhotoIndices = () => {
  const viewportTop = window.scrollY;
  const viewportBottom = viewportTop + window.innerHeight;
  const viewportMargin = window.innerHeight * 0.2;
  const minY = viewportTop - viewportMargin;
  const maxY = viewportBottom + viewportMargin;
  const visibleIndices = [];

  for (let i = 0; i < backgroundPhotos.length; i += 1) {
    const img = backgroundPhotos[i];
    const centerY = parseFloat(img.style.getPropertyValue("--y")) || 0;
    const height = parseFloat(img.style.getPropertyValue("--h")) || 0;
    const top = centerY - height / 2;
    const bottom = centerY + height / 2;

    if (bottom >= minY && top <= maxY) {
      visibleIndices.push(i);
    }
  }

  return visibleIndices;
};

const pickRandomPhotoIndex = () => {
  const visibleIndices = getVisiblePhotoIndices();
  const candidateIndices = visibleIndices.length
    ? visibleIndices
    : backgroundPhotos.map((_, index) => index);
  if (candidateIndices.length <= 1) return candidateIndices[0] || 0;

  let nextIndex = candidateIndices[Math.floor(Math.random() * candidateIndices.length)];
  let attempts = 0;
  while (nextIndex === lastFocusedIndex && attempts < 7) {
    nextIndex = candidateIndices[Math.floor(Math.random() * candidateIndices.length)];
    attempts += 1;
  }
  return nextIndex;
};

const scheduleNextPhotoFocus = () => {
  const delay = FOCUS_FADE_MS + 100 + Math.random() * 340;
  nextFocusTimer = window.setTimeout(runPhotoFocus, delay);
};

function runPhotoFocus() {
  if (!backgroundPhotos.length) return;

  const nextIndex = pickRandomPhotoIndex();
  const nextImage = backgroundPhotos[nextIndex];
  lastFocusedIndex = nextIndex;

  nextImage.classList.add(FOCUS_CLASS);

  focusTimeout = window.setTimeout(() => {
    nextImage.classList.remove(FOCUS_CLASS);
    scheduleNextPhotoFocus();
  }, FOCUS_FADE_MS + FOCUS_HOLD_MS);
}

scheduleNextPhotoFocus();

window.addEventListener("beforeunload", () => {
  if (focusTimeout) window.clearTimeout(focusTimeout);
  if (nextFocusTimer) window.clearTimeout(nextFocusTimer);
});
</script>

</body>
</html>
