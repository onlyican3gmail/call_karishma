<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karishma’s Private Control</title>

<style>
:root {
  font-family: "Poppins", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 20% 20%, #ff2d75 0%, transparent 40%),
    radial-gradient(circle at 80% 10%, #ff6fa5 0%, transparent 40%),
    linear-gradient(160deg, #12000a 0%, #250014 100%);
  color: #fff;
}

.card {
  width: min(560px, 95%);
  background: rgba(255, 0, 80, 0.08);
  backdrop-filter: blur(18px);
  border-radius: 30px;
  padding: 1.8rem;
  border: 1px solid rgba(255, 120, 180, 0.25);
  box-shadow: 0 25px 60px rgba(255, 0, 120, 0.3);
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Heartbeat glow animation */
@keyframes heartbeat {
  0% { transform: scale(1); }
  15% { transform: scale(1.05); }
  30% { transform: scale(1); }
  45% { transform: scale(1.08); }
  60% { transform: scale(1); }
}

.card.active {
  animation: heartbeat 1s infinite;
}

/* Pulse glow for button */
@keyframes pulseGlow {
  0% { box-shadow: 0 0 15px rgba(255, 0, 100, 0.4); }
  50% { box-shadow: 0 0 35px rgba(255, 0, 140, 0.9); }
  100% { box-shadow: 0 0 15px rgba(255, 0, 100, 0.4); }
}

h1 {
  margin: 0;
  font-size: 1.9rem;
  font-weight: 700;
}

.subtitle {
  margin: 0.5rem 0 1.2rem;
  font-size: 0.95rem;
  opacity: 0.85;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
  margin-bottom: 1.2rem;
}

.image-placeholder {
  height: 140px;
  border-radius: 18px;
  background: linear-gradient(135deg, #ff3c88, #ff89b5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 600;
  opacity: 0.7;
}

#status {
  display: inline-block;
  padding: 0.4rem 1rem;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.85rem;
  background: rgba(255,255,255,0.15);
  margin-bottom: 1rem;
}

#status.connecting { background: rgba(255, 120, 160, 0.4); }
#status.connected { background: rgba(255, 0, 120, 0.7); }
#status.disconnected { background: rgba(120, 0, 40, 0.7); }

#holdBtn {
  width: 100%;
  padding: 1.2rem;
  border-radius: 22px;
  border: none;
  font-size: 1.3rem;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(140deg, #ff2f7f, #ff66a3);
  color: #fff;
  transition: all 0.15s ease;
}

#holdBtn:hover:not(:disabled) {
  transform: translateY(-3px);
}

#holdBtn.sending {
  background: linear-gradient(140deg, #ff0055, #ff3388);
  animation: pulseGlow 1s infinite;
}

#holdBtn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#hint {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.9;
  min-height: 1.2rem;
}

.footer-text {
  margin-top: 1.5rem;
  font-size: 0.8rem;
  opacity: 0.6;
}
</style>
</head>

<body>

<main class="card" id="mainCard">
  <h1>Karishma’s Private Control 💕</h1>
  <p class="subtitle">Hold it… and feel my heartbeat race 💓</p>

  <div class="gallery">
    <div class="image-placeholder">Add Photo 1</div>
    <div class="image-placeholder">Add Photo 2</div>
    <div class="image-placeholder">Add Photo 3</div>
    <div class="image-placeholder">Add Photo 4</div>
  </div>

  <span id="status" class="connecting">Waking up...</span>

  <button id="holdBtn" type="button" disabled>
    Touch & Hold Me 💗
  </button>

  <p id="hint">Waiting for your touch…</p>

  <div class="footer-text">
    Made for Karishma’s most intimate moments 💋
  </div>
</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="./mqtt-control.js" defer></script>

<script>
const holdBtn = document.getElementById("holdBtn");
const card = document.getElementById("mainCard");

/* Sync heartbeat animation with hold state */
holdBtn.addEventListener("mousedown", () => {
  card.classList.add("active");
});

holdBtn.addEventListener("mouseup", () => {
  card.classList.remove("active");
});

holdBtn.addEventListener("mouseleave", () => {
  card.classList.remove("active");
});

/* Mobile support */
holdBtn.addEventListener("touchstart", () => {
  card.classList.add("active");
});

holdBtn.addEventListener("touchend", () => {
  card.classList.remove("active");
});
</script>

</body>
</html>
