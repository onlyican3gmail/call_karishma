    :root {
      --hot-pink: #ff0066;
      --deep-pink: #c40052;
      --glow-pink: #ff3399;
      --dark-bg: #0d0008;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 25%, #ff1a75 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, #ff4da6 0%, transparent 50%),
        linear-gradient(155deg, var(--dark-bg) 0%, #1a0012 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,51,153,0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: slowBreath 18s infinite ease-in-out;
    }
    @keyframes slowBreath {
      0%,100% { opacity: 0.4; transform: scale(1); }
      50%     { opacity: 0.9; transform: scale(1.15); }
    }
    .card {
      width: min(620px, 96%);
      background: rgba(200, 0, 80, 0.09);
      backdrop-filter: blur(20px);
      border-radius: 36px;
      padding: 2.2rem 1.8rem;
      border: 1px solid rgba(255, 80, 140, 0.3);
      box-shadow: 0 30px 80px rgba(200, 0, 80, 0.45);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    /* Intense heartbeat when held */
    @keyframes intenseHeartbeat {
      0%   { transform: scale(1) rotate(0deg); }
      10%  { transform: scale(1.06) rotate(0.5deg); }
      20%  { transform: scale(1) rotate(0deg); }
      35%  { transform: scale(1.09) rotate(-0.4deg); }
      50%  { transform: scale(1) rotate(0deg); }
      70%  { transform: scale(1.07) rotate(0.3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .card.active {
      animation: intenseHeartbeat 0.9s infinite ease-in-out;
      box-shadow: 0 40px 100px rgba(255, 51, 153, 0.7);
    }
    /* Button pulse when sending/held */
    @keyframes deepPulse {
      0%   { box-shadow: 0 0 20px rgba(255,51,153,0.5); transform: scale(1); }
      50%  { box-shadow: 0 0 60px rgba(255,0,102,0.95), 0 0 100px rgba(255,51,153,0.6); transform: scale(1.06); }
      100% { box-shadow: 0 0 20px rgba(255,51,153,0.5); transform: scale(1); }
    }
    h1 {
      margin: 0 0 0.4rem;
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.2rem, 9vw, 5.8rem);
      color: #fff;
      text-shadow: 0 6px 20px rgba(255,0,100,0.8);
      letter-spacing: -2px;
    }
    .subtitle {
      margin: 0 0 1.6rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #ffd1e8;
      opacity: 0.95;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0 2.2rem;
    }
    .photo {
      height: 180px;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(255, 102, 153, 0.4);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      transition: all 0.35s ease;
      background: linear-gradient(135deg, #ff3c88, #ff70b2);
    }
    .photo:hover {
      transform: scale(1.08) rotate(1.5deg);
      border-color: #ff3399;
      box-shadow: 0 20px 50px rgba(255,51,153,0.6);
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #status {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.12);
      margin-bottom: 1.4rem;
      backdrop-filter: blur(6px);
    }
    #status.connecting { background: rgba(255,140,180,0.4); color: #ffe6f2; }
    #status.connected  { background: rgba(255,0,120,0.75); color: white; box-shadow: 0 0 20px #ff3399; }
    #status.disconnected { background: rgba(120,0,50,0.6); color: #ffccdd; }
    #holdBtn {
      width: 100%;
      max-width: 420px;
      margin: 0 auto 1.4rem;
      padding: 1.4rem 1rem;
      border: none;
      border-radius: 999px;
      font-size: 1.45rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #ff1a75, #c40052);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 16px 40px rgba(200,0,80,0.5);
      user-select: none;
    }
    #holdBtn:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 24px 60px rgba(255,51,153,0.7);
    }
    #holdBtn:active, #holdBtn.sending {
      transform: translateY(2px) scale(0.96);
      background: linear-gradient(135deg, #d4005e, #ff0066);
      animation: deepPulse 0.8s infinite;
      box-shadow: 0 0 70px rgba(255,0,102,0.9);
    }
    #holdBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #hint {
      margin: 0.6rem 0 1.2rem;
      font-size: 1.05rem;
      color: #ffb3d9;
      font-style: italic;
      min-height: 1.6rem;
    }
    .footer-text {
      margin-top: 1.8rem;
      font-size: 0.85rem;
      opacity: 0.65;
      font-style: italic;
    }
    @media (max-width: 500px) {
      .card { padding: 1.8rem 1.3rem; border-radius: 28px; }
      h1 { font-size: 4rem; }
      .gallery { gap: 0.8rem; }
      .photo { height: 150px; }
    }
  </style>
</head>
<body>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="./mqtt-control.js" defer></script>
<script>
// Heartbeat + pulse sync when held (works with pointer/mouse or touch)
const holdBtn = document.getElementById("holdBtn");
const card    = document.getElementById("mainCard");

function activate() { card.classList.add("active"); }
function deactivate() { card.classList.remove("active"); }

// Desktop
holdBtn.addEventListener("pointerdown", activate);
holdBtn.addEventListener("pointerup",   deactivate);
holdBtn.addEventListener("pointerleave",deactivate);

// Better mobile/touch support
holdBtn.addEventListener("touchstart", (e) => { e.preventDefault(); activate(); });
holdBtn.addEventListener("touchend",   (e) => { e.preventDefault(); deactivate(); });
holdBtn.addEventListener("touchcancel",deactivate);
</script>
